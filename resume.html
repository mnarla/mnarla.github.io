      margin-bottom: 24px;
      box-shadow: var(--shadow-card-glass);

    .resume-viewer-frame iframe {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 180px);
      border: none;
      display: block;
    }

    .resume-fallback {
      padding: 48px 24px;
      text-align: center;
      font-family: var(--font-mono);
      color: var(--text-body);
